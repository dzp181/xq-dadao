name: xq-dadao

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印不推送'
        required: false
        default: 'false'
  schedule:
    # 每 30 分钟；境外 IP 可达性待验证，建议以国内服务器 crontab 为主
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: xq-dadao
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run
        env:
          XQ_NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 xq_push.py --dry-run
          else
            python3 xq_push.py
          fi
